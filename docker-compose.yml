services:

  mariadb:
    image: mariadb:10.11
    container_name: aihome-mariadb
    restart: unless-stopped

    environment:
      MARIADB_ROOT_PASSWORD: KSC4363*ms*
      MARIADB_DATABASE: ai_cre_wimlogic

    ports:
      - "3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5   

  backend:
    build:
      context: ./backend

    container_name: aihome-backend

    depends_on:
      mariadb:
        condition: service_healthy

    env_file:
      - ./backend/.env

    ports:
      - "8030:8030"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8030/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend

    container_name: aihome-frontend

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "4173:4173"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:4173"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mariadb_data: